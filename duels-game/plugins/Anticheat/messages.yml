# \u00BB is » (double >>), ANSI and UTF-8 interpret this differently... you may even see ? due to this
prefix: "&bAnticheat &8\u00BB"

alerts-enabled: "%prefix% &fAlertas habilitados."
alerts-disabled: "%prefix% &fAlertas desabilitados."
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% entrou usando %brand%."
console-specify-target: "%prefix% &cVocê deve especificar o nome do alvo!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cJogador não encontrado!"
player-not-this-server: "%prefix% &cO jogador não está no servidor!"
sender-not-found: "%prefix% &cVocê não pode usar este comando se estiver isento!"
spectate-return: "<click:run_command:/anticheat stopspectating><hover:show_text:\"/anticheat stopspectating\">
%prefix% &fClique aqui para retornar a localização anterior
</hover></click>"
cannot-spectate-return: "%prefix% &cVocê só pode fazer isso após espectar um jogador."
cannot-run-on-self: "%prefix% &cVocê não pode usar esse comando em sí mesmo!"
upload-log: "%prefix% &fRegistro enviado para: %url%"
upload-log-start: "%prefix% &fEnviando o registro. Aguarde."
upload-log-not-found: "%prefix% &cNúmero do registro não encontrado."
upload-log-upload-failure: "%prefix% &cAlgo deu errado ao enviar o registro, veja o terminal para mais informações."
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cEste comando só pode ser usado por jogadores!"
run-as-player-or-console: "%prefix% &cEste comando só pode ser usado por jogadores ou pelo console!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

# Valid placeholders:
# %prefix%
# %player%
# %check_name%
# %description%
# %experimental%
# %vl% - violations
# %verbose% - extra information from the check such as offsets, not all checks will add information
alerts-format: "%prefix% &f%player% &bfalhou em &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f%player% &bfalhou em &f%check_name%%experimental% &f(x&c%vl%&f) &7%verbose%"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bPerfil de &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersão: &f%version%"
    - "&bNome do Cliente: &f%brand%"
    - "&bSensibilidade Horizontal: &f%h_sensitivity%%"
    - "&bSensibilidade Vertical: &f%v_sensitivity%%"
    - "&bFastMath: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/anticheat alerts &f- &7Alterna noificações."
    - "/anticheat brands &f- &7Toggle brands"
    - "/anticheat profile <player> &f- &7Mosta as informações do jogador."
    - "/anticheat help &f- &7Mostra essa mensagem de ajuda."
    - "/anticheat debug <player> &f- &7Depura a simulação."
    - "/anticheat perf &f- &7Depura a performance."
    - "/anticheat reload &f- &7Recarrega as configurações."
    - "/anticheat spectate <player> &f- &7Especta um jogador."
    - "/anticheat verbose &f- &7Esconde as informações extra."
    - "/anticheat log [0-255] &f- &7Envia o registro da simulação."
    - "/anticheat history <player> [página] &f- &7Mostra alertas anteriores do jogador"
    - "&7======================"
grim-history-load-failure: "%prefix% &cO subsistema de histórico falhou ao carregar! Verifique o console do servidor por erros."
grim-history-disabled: "%prefix% &cO subsistema de histórico está desativado!"
grim-history-failed: "%prefix% &cFailed to load history: &7%error%"
grim-history-unknown-player: "%prefix% &cUnknown player: &f%player%"
grim-history-no-sessions: "%prefix% &7No session history for &f%player%&7."
grim-history-session-not-found: "%prefix% &cSession &f%ordinal%&c not found for &f%player%&c."

# Session list — valid placeholders: %prefix% %player% %page% %max_pages%
grim-history-header: "%prefix% &bMostrando logs de &f%player% (&f%page%&b/&f%maxPages%&f)"
# Single session summary line — valid placeholders:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% expands to grim-history-crashed-marker for sessions
# whose connection went away without a graceful close (server crash,
# kill -9, channel RST that didn't fire UserDisconnectEvent). Empty
# string for ongoing or gracefully-closed sessions.
grim-history-session: "<hover:show_text:'&bSession &7%session_uuid%<newline>&7Click or run &e%detail_command%<newline>&7to view session details.'>%prefix% &8[&b%grim_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSession &f%ordinal%&b duration &f%duration%&b with &c%violations%&b violations &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% ago&8)</hover>"

# Inline marker substituted into %crashed_marker% on session lines whose
# closed_at == last_activity (i.e. stamped by the next-boot crash sweep
# rather than the disconnect path). Includes a leading space so the
# marker reads naturally when present and disappears when empty.
grim-history-crashed-marker: " &8(&ccrashed&8)"

# Session detail — valid placeholders:
#   %prefix% %player% %ordinal% %grim_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
grim-history-detail-header: "%prefix% &bShowing &f%player%&b's session &f%ordinal%&b details:"
grim-history-detail-meta1: "%prefix% &bAnticheat: &f%grim_version%&b, Server: &f%server_name%&b, Duration: &f%duration%&b, Date: &7%timeago% ago"
grim-history-detail-meta2: "%prefix% &bClient: &f%client_version%&b, Brand: &f%client_brand%"
grim-history-detail-violations-header: "%prefix% &bViolations: &8(%violations% total, %unique_checks% unique)"
grim-history-detail-empty: "%prefix% &7- (none)"
# A grouped row (default) — valid placeholders: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% is built by joining grim-history-check-count entries with ", "
grim-history-detail-group: "<hover:show_text:'&bViolations in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
grim-history-detail-group-hover: "&bViolations in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
grim-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
grim-history-hover-description: " — &f%description%"
grim-history-detail-group-hover-verbose: " — &7%verbose%"
# A single raw violation row (--detailed) — valid placeholders:
#   %prefix% %offset% %check% %description% %vl% %verbose%
grim-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
grim-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
grim-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Inner format for each check in a group's %checks_list% — valid placeholders: %check_name% %count%
grim-history-check-count: "&f%check_name%&7 x&c%count%"

# Schema markers — see header comment in config.yml.
config-flavor: V2
config-version: 2
