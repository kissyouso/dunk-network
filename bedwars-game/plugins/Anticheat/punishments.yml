# %check_name% - nome da verificação
# %description% - descrição da verificação
# %vl% - violações
# %verbose% - informação extra
# %player% - nome do jogador
# [alert] - comando especial para alertar
# [webhook] - comando especial para alertar com a webhook do discord
Punishments:
  Simulation:
    # Depois de quantos segundos a violação deve expirar?
    remove-violations-after: 300
    # Essa sessão combina todas as verificações com os nomes listados abaixo.
    # Para excluir uma verificação que estaria combinada, adicione uma exclamação na frente do nome.
    # Por exemplo: - "!BadPacketsN"
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    # Limiar: Intervalo entre comandos
    #
    # Exemplo, para expulsar um jogador com a mensagem: "movimento incorreto!" depois de 100 violações, sem
    # repetir o comando:
    # - "100:0 kick %player% movimento incorreto!"
    # 0 significa executar somente uma vez.
    # - "100:50 say %player% está trapaceando!"
    # Executa quando o jogador alcança 100 violações e depois disso a cada 50 violações após as 100.
    #
    commands:
      - "100:40 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "100:40 [log]"
      - "100:100 [webhook]"
  Knockback:
    remove-violations-after: 300
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:5 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "5:5 [log]"
      - "20:20 [webhook]"
  Post:
    remove-violations-after: 300
    checks:
      - "Post"
    commands:
      - "20:20 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "20:20 [log]"
      - "40:40 [webhook]"
  BadPackets:
    remove-violations-after: 300
    checks:
      - "BadPackets"
      - "PacketOrder"
      - "Crash"
    commands:
      - "20:20 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "20:20 [log]"
      - "40:40 [webhook]"
  Reach:
    remove-violations-after: 300
    checks:
      - "Reach"
    commands:
      - "1:1 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "1:1 [log]"
      - "1:1 [webhook]"
  Hitboxes:
    remove-violations-after: 300
    checks:
      - "Hitboxes"
    commands:
      - "5:3 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "5:3 [log]"
      - "5:3 [webhook]"
  Misc:
    remove-violations-after: 300
    checks:
      - "Vehicle"
      - "NoSlow"
      - "Sprint"
      - "MultiActions"
      - "Place"
      - "Baritone"
      - "Break"
      - "TransactionOrder"
      - "Elytra"
      - "Chat"
      - "Exploit"
    commands:
      - "10:5 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "10:5 [log]"
      - "20:10 [webhook]"
  Combat:
    remove-violations-after: 300
    checks:
      - "Interact"
      - "Aim"
    commands:
      - "20:40 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "20:40 [log]"
  # Dês da 2.2.10, não temos verificações de AutoClicker, isso é somente um placeholder. Grim vai verificar por AutoClicker no futuro.
  Autoclicker:
    remove-violations-after: 300
    checks:
      - "Autoclicker"
    commands:
      - "20:40 dunkacbridge flag %uuid% %vl% %ping% %check_name%"
      - "20:40 [log]"
