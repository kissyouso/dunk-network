# NPCs do lobby do BedWars.
# Comandos:
# /bw npcs
# /bw npc add <id> <solo/duplas/trios/quartetos/duels>
# /bw npc remove <id>

npcs: {}

# NPC aparece como personagem/player, não como villager.
# O villager usado como hitbox fica invisível.
skin:
  # Skin padrão aplicada em todos os NPCs. Pode trocar por outro value/signature depois.
  value: ''
  signature: ''
  equipment:
    hand: 'AIR'
    boots: 'AIR'
    leggings: 'AIR'
    chestplate: 'AIR'


modes:
  solo:
    display: 'Solo'
    online: 0
    hologram:
    - '&b&lSOLO'
    - '&e%jogadores_jogandosolo% jogando!'
    menu:
      title: '&8Bed Wars Solo'
  duplas:
    display: 'Duplas'
    online: 0
    hologram:
    - '&b&lDUPLAS'
    - '&e%jogadores_jogandoduplas% jogando!'
    menu:
      title: '&8Bed Wars Duplas'
  trios:
    display: 'Trios'
    online: 0
    hologram:
    - '&b&lTRIOS'
    - '&e%jogadores_jogandotrios% jogando!'
    menu:
      title: '&8Bed Wars Trios'
  quartetos:
    display: 'Quartetos'
    online: 0
    hologram:
    - '&b&lQUARTETOS'
    - '&e%jogadores_jogandoquartetos% jogando!'
    menu:
      title: '&8Bed Wars Quartetos'
  duels:
    display: 'Duels'
    online: 0
    hologram:
    - '&b&lDUELS'
    - '&e%jogadores_jogandoduels% jogando!'
    menu:
      title: '&8Bed Wars Duels'

menu:
  size: 27
  # Sem glass filter. Só esses 2 itens, igual o modelo que você mandou.

  select-map:
    permission: 'wbedwars.vip.selectmap'
    no-permission: '&cEsse menu é exclusivo para VIPs.'
    name: '&aSelecionar mapa'
    lore:
    - '&7Escolha o mapa que você'
    - '&7quer jogar.'
    - ''
    - '&7Exclusivo para &aVIPs'
    - ''
    - '&eClique para navegar.'
  items:
    jogar:
      slot: 11
      icon: 'FIREWORK : 1 : nome>&aJogar Bed Wars {mode_display} : desc>&7Clique para procurar uma sala.'
      execute: ''
    voltar:
      slot: 26
      icon: 'ARROW : 1 : nome>&cVoltar : desc>&7Clique para fechar o menu.'
      execute: 'close'
    info:
      slot: 15
      icon: 'PAPER : 1 : nome>&aSelecionar mapa : desc>&7Escolha o mapa que você\n&7quer jogar.\n\n&7Exclusivo para &aVIPs\n\n&eClique para navegar.'
      execute: ''
