# Configuração principal do wSkin
settings:
  debug: true
  save-by-uuid: true
  # 0 troca mais rápido. Não usa respawn para não bugar a câmera.
  skin-update-delay-ticks: 0
  fetch-timeout-ms: 3500
  cache-enabled: true
  cache-minutes: 1440
  apply-on-join-delay-ticks: 0
  require-permissions: true

original-skin:
  # Se o jogador tiver conta original/premium com o mesmo nick, entra com a própria skin.
  # Se não encontrar skin original, o plugin usa a skin padrão abaixo.
  enabled: true

default-skin:
  enabled: true
  # Skin aplicada automaticamente apenas para jogadores sem skin manual salva e sem skin original encontrada.
  # Ela NÃO é salva como escolha do jogador, para não prender conta original na skin padrão.
  # Pode trocar por qualquer nick premium bonito.
  skin: Dream

refresh:
  # Necessário para atualizar a skin na própria tela sem precisar relogar.
  self-respawn: true
  # Atualiza a skin para outros jogadores.
  spawn-packets: true
  hide-show: true
  self-tab: true

sounds:
  enabled: true
  success: LEVEL_UP
  error: VILLAGER_NO
  click: CLICK

menus:
  main:
    title: '&8Menu de Skins'
    rows: 5
    filler:
      enabled: true
      material: STAINED_GLASS_PANE
      data: 7
      name: ' '
    items:
      info:
        slot: 13
      custom:
        slot: 20
      library:
        slot: 24
      close:
        slot: 40
  categories:
    title: '&8Categorias de Skins'
    rows: 5
  library:
    title: '&8Biblioteca: %category% (%page%/%pages%)'
    rows: 5
    auto-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
    previous:
      slot: 36
      material: ARROW
      name: '&aPágina anterior'
      lore:
      - '&7Clique para voltar.'
    next:
      slot: 44
      material: ARROW
      name: '&aPróxima página'
      lore:
      - '&7Clique para avançar.'
    back:
      slot: 39
      material: ARROW
      name: '&eVoltar'
      lore:
      - '&7Clique para voltar às categorias.'
    close:
      slot: 41
      material: BARRIER
      name: '&cFechar'
      lore:
      - '&7Clique para fechar.'

storage:
  # YAML, MYSQL ou MONGODB
  # MongoDB usa fallback YAML se a biblioteca do driver não existir no servidor.
  type: YAML
  mysql:
    host: "CHANGE_ME"
    port: 3306
    database: wskin
    username: "CHANGE_ME"
    password: "CHANGE_ME"
    table: wskin_players
    params: 'useSSL=false&autoReconnect=true'
  mongodb:
    uri: "CHANGE_ME"
    database: wskin
    collection: players
