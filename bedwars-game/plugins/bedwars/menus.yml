      execute: 'PREF>clan_invites'
    tnt_timer:
      slot: 21
      icon: 'TNT : 1 : nome>&aTempo da TNT : desc>&7Mostra ou esconde o contador\n&7em cima da TNT colocada.\n \n&7Status: {pref_tnt}\n \n&eClique para alternar.'
