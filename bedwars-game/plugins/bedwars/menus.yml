    vulcan_alerts:
      slot: 22
      icon: 'REDSTONE_TORCH_ON : 1 : nome>&aAlertas Vulcan : desc>&7Staff pode ativar/desativar\n&7os alertas do Vulcan.\n \n&7Status: {pref_vulcan}\n \n&eClique para alternar.'
