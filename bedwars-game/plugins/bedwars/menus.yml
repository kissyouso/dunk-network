profile:
  title: '&8Perfil'
  size: 54
  items:
    info:
      slot: 13
      icon: "%perfil%SKULL_ITEM:3 : 1 : nome>&eSuas Informações : desc>&7Rank: &f%wtag_prefix%\n\
        \ \n&7Primeiro Login: &f{first_login}\n&7Ultimo Login: &f{last_login}"
    nick:
      slot: 30
      icon: 'PAPER : 1 : nome>&aNick (/nick) : desc>&7Clique para usar o sistema de nick.'
      execute: PLAYER>nick
    statistics:
      slot: 31
      icon: |-
        BOOK : 1 : nome>&aEstatisticas : desc>&7Em breve você poderá ver
        &7suas estatísticas completas.
      execute: MENU>statistics
    preferences:
      slot: 39
      icon: |-
        REDSTONE_COMPARATOR : 1 : nome>&aPreferencias : desc>&7Configure chat, party, amigos,
        &7mensagens privadas e convites.
      execute: MENU>preferences
    medals:
      slot: 40
      icon: 'DOUBLE_PLANT : 1 : nome>&aMedalhas : desc>&7Clique para abrir suas medalhas.'
      execute: PLAYER>medals
    skins:
      slot: 32
      icon: |-
        COMPASS : 1 : nome>&aBiblioteca de Skin : desc>&7Clique para abrir a biblioteca
        &7de skins.
      execute: PLAYER>skin menu
    clan_tags:
      slot: 41
      icon: |-
        425 : 1 : nome>&aTags do Clan : desc>&7Clique para escolher a cor
        &7da tag do seu clan.
      execute: PLAYER>clan cortag
