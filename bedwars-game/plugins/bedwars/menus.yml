      icon: 'BED : 1 : nome>&aConfirmar Volta ao Lobby : desc>&7Pede confirmação ao usar /lobby\n&7ou /l durante uma partida.\n \n&7Status: {pref_lobby}\n \n&eClique para alternar.'
