# Skins da biblioteca do wSkin.
# Você pode usar de 2 jeitos:
# 1) skin: NickPremium -> o plugin busca na Mojang.
# 2) name_value/name_signature ou texture.value/texture.signature -> textura fixa, não muda se a conta trocar de skin.
#
# Exemplo de textura fixa:
# skins:
#   exemplo:
#     name: '&aExemplo'
#     category: personagens
#     name_value: 'COLE_AQUI_O_VALUE'
#     name_signature: 'COLE_AQUI_A_SIGNATURE'
#     lore:
#     - '&7Fonte: &fBiblioteca fixa'
#     - '&eClique para usar.'

